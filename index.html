<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frogger</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <!--
    Standalone Frogger. The game is authored as a Games Room MODULE (frogger.js
    registers itself via window.GamesHost.register). This page is a ~40-line
    host SHIM that provides the same ctx contract — proving the module never
    depends on the full lobby. The same frogger.js is what the Games Room mounts.
  -->
  <script>
    // Minimal host shim: just enough of the GamesHost contract to run solo.
    window.GamesHost = {
      gameActive: false,
      _factory: null,
      register: function (id, factory) { this._factory = factory; }
    };
    // Trigger → click by hand: cast along the raycaster's own ray (matches the
    // visible laser), click the closest .clickable. The scene dedupe below
    // collapses this + A-Frame's native release-click into one per trigger hold.
    if (!AFRAME.components['laser-click']) AFRAME.registerComponent('laser-click', {
      init: function () {
        var el = this.el, self = this; this._ray = new THREE.Raycaster();
        var press = function () {
          var rcomp = el.components.raycaster, origin, dir;
          if (rcomp && rcomp.raycaster && rcomp.raycaster.ray) {
            origin = rcomp.raycaster.ray.origin.clone();
            dir = rcomp.raycaster.ray.direction.clone().normalize();
          } else {
            el.object3D.updateMatrixWorld();
            var m = el.object3D.matrixWorld;
            origin = new THREE.Vector3().setFromMatrixPosition(m);
            dir = new THREE.Vector3(0, 0, -1).transformDirection(m).normalize();
          }
          self._ray.set(origin, dir); self._ray.near = 0; self._ray.far = 12;
          var targets = [];
          el.sceneEl.querySelectorAll('.clickable').forEach(function (e) { if (e.object3D) targets.push(e.object3D); });
          var hits = self._ray.intersectObjects(targets, true);
          if (!hits.length) return;
          var o = hits[0].object, target = null;
          while (o) { if (o.el && o.el.classList && o.el.classList.contains('clickable')) { target = o.el; break; } o = o.parent; }
          if (target) target.emit('click', null, false);
        };
        ['triggerdown', 'selectstart', 'abuttondown', 'xbuttondown'].forEach(function (e) { el.addEventListener(e, press); });
      }
    });
    // One click per trigger press→release (swallows the native release-click).
    window.installClickDedupe = function (scene) {
      if (scene.__clickDedupe) return; scene.__clickDedupe = true;
      var pending = false, inGesture = false;
      var down = function () { if (inGesture) return; inGesture = true; pending = true; };
      var up = function () { inGesture = false; pending = false; };
      ['#leftHand', '#rightHand'].forEach(function (s) {
        var h = document.querySelector(s); if (!h) return;
        ['triggerdown', 'selectstart', 'abuttondown', 'xbuttondown', 'gripdown'].forEach(function (e) { h.addEventListener(e, down); });
        ['triggerup', 'selectend'].forEach(function (e) { h.addEventListener(e, up); });
      });
      window.addEventListener('mousedown', down, true);
      window.addEventListener('mouseup', function () { setTimeout(up, 0); }, true);
      scene.addEventListener('click', function (e) {
        var t = e.target;
        if (!t || !(t.classList && t.classList.contains('clickable'))) return;
        if (pending) { pending = false; } else { e.stopImmediatePropagation(); }
      }, true);
    };
  </script>
  <script src="frogger.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var scene = document.querySelector('a-scene');
      var host = window.GamesHost;
      var instance = null, root = null, veil = null, panel = null;

      function boot() {
        var cam = document.querySelector('#camera');
        veil = document.createElement('a-plane');
        veil.setAttribute('position', '0 0 -0.25');
        veil.setAttribute('width', 6); veil.setAttribute('height', 5);
        veil.setAttribute('material', 'color: #000; opacity: 0; transparent: true; shader: flat; depthWrite: false');
        veil.setAttribute('visible', 'false');
        veil.addEventListener('loaded', function () {
          var m = veil.getObject3D('mesh'); if (m) { m.renderOrder = 1000; m.material.depthTest = false; }
        });
        cam.appendChild(veil);

        panel = document.querySelector('#startPanel');
      }

      function fadeTo(o, d) {
        if (!veil) return;
        veil.setAttribute('visible', 'true');
        veil.removeAttribute('animation__v');
        veil.setAttribute('animation__v', { property: 'material.opacity', to: o, dur: d, easing: 'easeInOutQuad' });
        if (o === 0) setTimeout(function () { veil.setAttribute('visible', 'false'); }, d + 60);
      }

      function buildCtx() {
        root = document.createElement('a-entity');
        root.setAttribute('id', 'game-root');
        scene.appendChild(root);
        return {
          sceneEl: scene, root: root,
          rig: document.querySelector('#rig'),
          camera: document.querySelector('#camera'),
          leftHand: document.querySelector('#leftHand'),
          rightHand: document.querySelector('#rightHand'),
          ambientLight: document.querySelector('#sceneAmbient'),
          dirLight: document.querySelector('#sceneDir'),
          fadeTo: fadeTo,
          requestExit: onExit,
          resolve: function (p) { return new URL(p, document.baseURI).href; },
          isVR: function () { return scene.is('vr-mode'); }
        };
      }

      function startGame() {
        if (!host._factory || host.gameActive) return;
        host.gameActive = true;
        if (panel) panel.setAttribute('visible', 'false');
        fadeTo(1, 1);
        var ctx = buildCtx();
        instance = host._factory.create(ctx);
        instance.mount().then(function () {
          setTimeout(function () { fadeTo(0, 500); }, 120);
          setTimeout(function () { if (instance && instance.start) instance.start(); }, 520);
        });
      }

      function onExit() {
        host.gameActive = false;
        if (instance) { try { instance.unmount(); } catch (e) { console.error(e); } instance = null; }
        if (root && root.parentNode) { root.parentNode.removeChild(root); root = null; }
        if (panel) panel.setAttribute('visible', 'true');
        fadeTo(0, 300);
      }

      var start = function () { boot();
        if (window.installClickDedupe) window.installClickDedupe(scene);
        document.querySelectorAll('[data-start]').forEach(function (el) {
          el.addEventListener('click', startGame);
        }); };
      if (scene.hasLoaded) start(); else scene.addEventListener('loaded', start);
    });
  </script>
</head>
<body>
  <a-scene renderer="antialias: true; colorManagement: true" background="color: #bfe3f5" vr-mode-ui="enabled: true">
    <a-entity id="sceneAmbient" light="type: ambient; color: #ffffff; intensity: 0.6"></a-entity>
    <a-entity id="sceneDir" light="type: directional; color: #fff2cc; intensity: 0.6" position="-15 30 10"></a-entity>

    <a-entity id="rig" position="0 0 0">
      <a-camera id="camera" position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="enabled: true; acceleration: 18">
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 30"></a-entity>
      </a-camera>
      <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .clickable; far: 8" laser-click
                line="color: #8fb7e0"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .clickable; far: 8" laser-click
                line="color: #8fb7e0"></a-entity>
    </a-entity>

    <!-- Start prompt (also satisfies the audio-unlock gesture). -->
    <a-entity id="startPanel" position="0 1.5 -2">
      <a-box class="clickable" data-start width="1.4" height="0.5" depth="0.05" material="color: #22c55e; emissive: #22c55e; emissiveIntensity: 0.3"></a-box>
      <a-text value="PLAY FROGGER" align="center" width="3" color="#0b1220" position="0 0 0.04"></a-text>
    </a-entity>
  </a-scene>
</body>
</html>
